name: Hamsi Single ISO Release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/build-live-github.sh'
      - '.github/workflows/build-single-iso.yml'

permissions:
  contents: write

concurrency:
  group: hamsi-single-iso
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Kaynakları al
        uses: actions/checkout@v4

      - name: Disk alanını hazırla
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: true

      - name: Hamsi ISO'yu derle ve doğrula
        run: bash scripts/build-live-github.sh

      - name: ISO bilgisini göster
        run: |
          ls -lh dist/Hamsi-0.1-Live-x86_64.iso
          cat dist/Hamsi-0.1-Live-x86_64.iso.sha256

      - name: Tek parça GitHub Release oluştur
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="hamsi-0.1-live-${GITHUB_RUN_NUMBER}"
          gh release create "$tag" \
            --target "$GITHUB_SHA" \
            --title "Hamsi 0.1 Live x86-64 · Build ${GITHUB_RUN_NUMBER}" \
            --notes "Tek parça, USB'ye yazılabilir Hamsi canlı/kurulum ISO'su. SHA-256 dosyası aynı sürümde yer alır." \
            dist/Hamsi-0.1-Live-x86_64.iso \
            dist/Hamsi-0.1-Live-x86_64.iso.sha256 \
            dist/Hamsi-0.1-Live-x86_64.iso.boot-report.txt

# Hamsi Linux x86-64 desktop kernel policy
CONFIG_64BIT=y
CONFIG_SMP=y
CONFIG_PREEMPT_DYNAMIC=y
CONFIG_HZ_1000=y
CONFIG_SCHED_AUTOGROUP=y

CONFIG_EFI=y
CONFIG_EFI_STUB=y
CONFIG_EFI_PARTITION=y
CONFIG_BLK_DEV_INITRD=y
CONFIG_BLK_DEV_LOOP=y

CONFIG_CGROUPS=y
CONFIG_CGROUP_BPF=y
CONFIG_NAMESPACES=y
CONFIG_USER_NS=y
CONFIG_SECCOMP=y
CONFIG_SECCOMP_FILTER=y

CONFIG_SECURITY=y
CONFIG_SECURITY_YAMA=y
CONFIG_SECURITY_LOCKDOWN_LSM=y
CONFIG_INTEGRITY=y
CONFIG_TCG_TPM=y
CONFIG_TCG_TIS=y

CONFIG_EXT4_FS=y
CONFIG_VFAT_FS=y
CONFIG_SQUASHFS=y
CONFIG_OVERLAY_FS=m
CONFIG_BTRFS_FS=m
CONFIG_F2FS_FS=m
CONFIG_NTFS3_FS=m
CONFIG_EXFAT_FS=m
CONFIG_DM_CRYPT=m

CONFIG_IPV6=y
CONFIG_WIREGUARD=m
CONFIG_NF_TABLES=m

CONFIG_KVM=y
CONFIG_KVM_INTEL=m
CONFIG_KVM_AMD=m
CONFIG_VHOST_NET=m
CONFIG_VIRTIO_PCI=m
CONFIG_VIRTIO_BLK=m
CONFIG_VIRTIO_NET=m

CONFIG_DRM=y
CONFIG_DRM_I915=m
CONFIG_DRM_AMDGPU=m
CONFIG_DRM_NOUVEAU=m
CONFIG_DRM_VIRTIO_GPU=m

CONFIG_SND=y
CONFIG_SND_HDA_INTEL=m
CONFIG_SND_USB_AUDIO=m

CONFIG_BT=m
CONFIG_BT_RFCOMM=m
CONFIG_BT_HIDP=m
CONFIG_CFG80211=m
CONFIG_MAC80211=m

CONFIG_USB_XHCI_HCD=y
CONFIG_USB_STORAGE=y
CONFIG_HID_MULTITOUCH=m
